version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: pulsebeacon_postgres
    restart: always
    environment:
      POSTGRES_USER: pulsebeacon_user
      POSTGRES_PASSWORD: pulsebeacon_secure_password_2026
      POSTGRES_DB: pulsebeacon_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulsebeacon_user -d pulsebeacon_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pulsebeacon_api
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - POSTGRES_DATABASE_URL=postgresql://pulsebeacon_user:pulsebeacon_secure_password_2026@db:5432/pulsebeacon_db
      - SECRET_KEY=pulsebeacon_jwt_production_secret_key_9941
      - BLE_HMAC_SECRET=pulsebeacon_ble_hmac_production_key_4481
      - BLE_NONCE_VALIDITY_WINDOW_SECONDS=30
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head && uvicorn backend.app.main:app --host 0.0.0.0 --port 8000"

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: pulsebeacon_web
    restart: always
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api
    depends_on:
      - backend

volumes:
  postgres_data:
